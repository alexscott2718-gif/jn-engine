name: regenerate goldens

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: regenerate in llvmpipe
    runs-on: ubuntu-24.04
    env:
      BRANCH: automation/regen-goldens-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical rendering environment
        run: docker build -t jn-engine-kit .

      - name: Regenerate goldens in the container
        run: docker run --rm -v "$PWD:/w" -w /w jn-engine-kit make regen-goldens

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- tests/goldens; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated frames
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$BRANCH"
          git add tests/goldens
          git commit -m "test: regenerate software-rendered goldens"
          git push --set-upstream origin "$BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "test: regenerate software-rendered goldens" \
            --body "Goldens regenerated by workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID inside the canonical llvmpipe Docker image."

      - name: Report unchanged goldens
        if: steps.changes.outputs.changed != 'true'
        run: echo "The checked-in goldens already match the canonical container output."
