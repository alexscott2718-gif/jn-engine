<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>JN Engine — Playable Levels</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0d10; color: #c8d0d8;
               font: 14px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; }
  h1 { font-size: 15px; font-weight: 600; margin: 4px 0 0; color: #9fb3c8; }
  #note { font-size: 12px; color: #6b7785; max-width: 900px; text-align: center; }
  /* Pin the canvas display size with !important so any inline style the
     Emscripten SDL2 port injects on the canvas element (it sets style.width
     / style.height to match the SDL window) can't collapse the visible
     canvas. The drawing buffer is controlled separately by canvas.width /
     canvas.height attributes (set by emscripten_set_canvas_element_size in
     window_init under __EMSCRIPTEN__). */
  canvas#canvas {
    background: #000;
    border: 1px solid #1c2530;
    width: min(1280px, 100%) !important;
    height: auto !important;
    aspect-ratio: 1280 / 720;
    image-rendering: auto;
    outline: none;
  }
  #status { font-size: 12px; color: #7d8896; min-height: 16px; }
  #progress { width: 360px; max-width: 90%; height: 6px;
              accent-color: #9fb3c8; }
  #progress[hidden] { display: none; }
  #controls { font-size: 12px; color: #6b7785; }
  #levelnav { display: flex; align-items: center; justify-content: center; gap: 8px;
              flex-wrap: wrap; max-width: 980px; }
  #levelnav button, #levelSelect {
    background: #151b22; color: #c8d0d8; border: 1px solid #273241;
    border-radius: 4px; padding: 5px 8px; font: 12px system-ui, sans-serif;
  }
  #levelnav button { cursor: pointer; }
  #levelnav button:hover, #levelSelect:hover { border-color: #53677f; }
  #levelLinks { display: flex; flex-wrap: wrap; justify-content: center;
                gap: 5px; max-width: 980px; }
  #levelLinks a {
    color: #9fb3c8; text-decoration: none; border: 1px solid #273241;
    border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
  #levelLinks a.active { background: #263244; border-color: #7890ad; color: #e8f0f8; }

  /* ---- Touch controls (mobile) ---- */
  /* #stage wraps the canvas so the overlay can position over it. */
  #stage { position: relative; width: min(1280px, 100%); }
  #stage canvas#canvas { display: block; width: 100% !important; }
  #touch { position: absolute; inset: 0; pointer-events: none;
           display: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* Shown only when the device reports coarse (touch) pointer. */
  body.touch #touch { display: block; }
  #joy { position: absolute; left: 5%; bottom: 8%;
         width: 38vw; max-width: 180px; aspect-ratio: 1;
         border-radius: 50%; background: rgba(40,52,66,0.35);
         border: 2px solid rgba(159,179,200,0.4); pointer-events: auto; }
  #joynub { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%;
            transform: translate(-50%,-50%); border-radius: 50%;
            background: rgba(159,179,200,0.65); border: 2px solid rgba(200,216,230,0.8); }
  #flyButtons { position: absolute; right: 6%; bottom: 8%;
                display: flex; flex-direction: column; gap: 12px;
                pointer-events: none; }
  #jump, #flyDown {
          width: 22vw; max-width: 110px; aspect-ratio: 1; border-radius: 50%;
          color: #eaffea; font: 600 18px/1 system-ui, sans-serif;
          display: flex; align-items: center; justify-content: center;
          pointer-events: auto; -webkit-tap-highlight-color: transparent; }
  #jump { background: rgba(70,110,70,0.5);
          border: 2px solid rgba(160,210,160,0.8); }
  #jump:active { background: rgba(90,150,90,0.7); }
  #flyDown { display: none; background: rgba(92,74,54,0.55);
             border: 2px solid rgba(220,180,135,0.82); color: #fff1df; }
  body.noclip #flyDown { display: flex; }
  #flyDown:active { background: rgba(130,96,62,0.75); }
</style>
</head>
<body>
<div id="wrap">
  <h1 id="title">Jimmy Neutron — Level 2</h1>
  <div id="levelnav">
    <button id="prevLevel" type="button">Previous</button>
    <select id="levelSelect" aria-label="Playable level"></select>
    <button id="nextLevel" type="button">Next</button>
    <button id="noclipToggle" type="button">Noclip: Off</button>
    <button id="turboToggle" type="button">Speed: 1x</button>
  </div>
  <div id="levelLinks"></div>
  <div id="status">Loading…</div>
  <progress id="progress" max="100" value="0"></progress>
  <div id="stage">
    <canvas id="canvas" width="1280" height="720" tabindex="0"
            oncontextmenu="event.preventDefault()"></canvas>
    <div id="touch">
      <div id="joy"><div id="joynub"></div></div>
      <div id="flyButtons">
        <div id="jump">JUMP</div>
        <div id="flyDown">DOWN</div>
      </div>
    </div>
  </div>
  <div id="controls">WASD move · SPACE jump/up · Ctrl/Q down · SHIFT run · T speed · N noclip · R respawn · drag = orbit</div>
  <div id="note">
    Native WebGL2 rebuild using original GAM/OMT data.
  </div>
</div>
<script type="text/javascript">
  var GAME1_LEVELS = [
    'level1', 'level1a', 'level1b', 'level1c', 'level1d', 'level1e', 'level1f',
    'level2', 'level2a', 'level2b',
    'level3', 'level3a', 'level3c', 'level3d',
    'level4', 'level4a', 'level4b', 'level4c', 'level4d',
    'level5', 'level5a', 'level5b',
    'level6', 'level6a',
    'level7'
  ];
  var GAME1_LABELS = {
    level1: 'Level 1', level1a: 'Level 1A', level1b: 'Level 1B',
    level1c: 'Level 1C', level1d: 'Level 1D', level1e: 'Level 1E',
    level1f: 'Level 1F', level2: 'Level 2', level2a: 'Level 2A',
    level2b: 'Level 2B', level3: 'Level 3', level3a: 'Level 3A',
    level3c: 'Level 3C', level3d: 'Level 3D', level4: 'Level 4',
    level4a: 'Level 4A', level4b: 'Level 4B', level4c: 'Level 4C',
    level4d: 'Level 4D', level5: 'Level 5', level5a: 'Level 5A',
    level5b: 'Level 5B', level6: 'Level 6', level6a: 'Level 6A',
    level7: 'Level 7'
  };
  var JNVSJN_LEVELS = [
    'level1', 'level1_a', 'level1_b', 'level1_c', 'level1b', 'level1d',
    'level3', 'level3a', 'level3c', 'level3d',
    'level4', 'level4a', 'level4b',
    'level5', 'level5a', 'level5b', 'level5b1', 'level5c'
  ];
  var JNVSJN_LABELS = {
    level1: 'Level 1', level1_a: 'Level 1 A', level1_b: 'Level 1 B',
    level1_c: 'Level 1 C', level1b: 'Level 1B', level1d: 'Level 1D',
    level3: 'Level 3', level3a: 'Level 3A', level3c: 'Level 3C',
    level3d: 'Level 3D', level4: 'Level 4', level4a: 'Level 4A',
    level4b: 'Level 4B', level5: 'Level 5', level5a: 'Level 5A',
    level5b: 'Level 5B', level5b1: 'Level 5B1', level5c: 'Level 5C'
  };
  function isJnvsjnBuild() {
    return /(^|\/)(jnvsjn)(\/|$)/.test(window.location.pathname.toLowerCase());
  }
  var GAME_TITLE = isJnvsjnBuild()
      ? 'Jimmy Neutron vs Jimmy Negatron'
      : 'Jimmy Neutron';
  var PLAYABLE_LEVELS = isJnvsjnBuild() ? JNVSJN_LEVELS : GAME1_LEVELS;
  var LEVEL_LABELS = isJnvsjnBuild() ? JNVSJN_LABELS : GAME1_LABELS;
  var DEFAULT_LEVEL = isJnvsjnBuild() ? 'level1_a' : 'level2';

  function normalizeLevelParam(v) {
    if (!v) return '';
    v = String(v).toLowerCase().replace(/\.gam$/, '');
    return PLAYABLE_LEVELS.indexOf(v) >= 0 ? v : '';
  }
  var selectedLevel = normalizeLevelParam(
      new URLSearchParams(window.location.search).get('level')) || DEFAULT_LEVEL;
  var selectedLabel = LEVEL_LABELS[selectedLevel] || selectedLevel;
  document.title = GAME_TITLE + ' — ' + selectedLabel;
  document.getElementById('title').textContent = GAME_TITLE + ' — ' + selectedLabel;

  function levelHref(level) {
    var url = new URL(window.location.href);
    url.searchParams.set('level', level);
    return url.pathname + url.search + url.hash;
  }
  function goLevel(level) {
    window.location.href = levelHref(level);
  }
  (function buildLevelCatalog() {
    var select = document.getElementById('levelSelect');
    var links = document.getElementById('levelLinks');
    for (var i = 0; i < PLAYABLE_LEVELS.length; i++) {
      var level = PLAYABLE_LEVELS[i];
      var label = LEVEL_LABELS[level] || level;
      var opt = document.createElement('option');
      opt.value = level;
      opt.textContent = label;
      if (level === selectedLevel) opt.selected = true;
      select.appendChild(opt);

      var a = document.createElement('a');
      a.href = levelHref(level);
      a.textContent = label;
      if (level === selectedLevel) a.className = 'active';
      links.appendChild(a);
    }
    select.addEventListener('change', function () { goLevel(select.value); });
    document.getElementById('prevLevel').addEventListener('click', function () {
      var i = PLAYABLE_LEVELS.indexOf(selectedLevel);
      goLevel(PLAYABLE_LEVELS[(i + PLAYABLE_LEVELS.length - 1) % PLAYABLE_LEVELS.length]);
    });
    document.getElementById('nextLevel').addEventListener('click', function () {
      var i = PLAYABLE_LEVELS.indexOf(selectedLevel);
      goLevel(PLAYABLE_LEVELS[(i + 1) % PLAYABLE_LEVELS.length]);
    });
  })();

  var noclipButton = document.getElementById('noclipToggle');
  function setNoclipButton(enabled) {
    noclipButton.textContent = enabled ? 'Noclip: On' : 'Noclip: Off';
    document.body.classList.toggle('noclip', !!enabled);
    var jump = document.getElementById('jump');
    if (jump) jump.textContent = enabled ? 'UP' : 'JUMP';
  }
  noclipButton.addEventListener('click', function () {
    if (!Module || !Module.ccall) return;
    try {
      setNoclipButton(!!Module.ccall('input_toggle_noclip', 'number', [], []));
      document.getElementById('canvas').focus();
    } catch (e) {}
  });

  var turboButton = document.getElementById('turboToggle');
  function setTurboButton(enabled) {
    turboButton.textContent = enabled ? 'Speed: 4x' : 'Speed: 1x';
  }
  turboButton.addEventListener('click', function () {
    if (!Module || !Module.ccall) return;
    try {
      setTurboButton(!!Module.ccall('input_toggle_turbo', 'number', [], []));
      document.getElementById('canvas').focus();
    } catch (e) {}
  });

  var statusEl = document.getElementById('status');
  var canvasEl = document.getElementById('canvas');
  var TARGET_W = 1280, TARGET_H = 720;

  /* Defence-in-depth: Emscripten's SDL2 port occasionally writes to the
     canvas drawing-buffer attributes during async preload (the OffscreenCanvas
     proxy path is the usual culprit). If a write lands while the page layout
     is still settling — common with --preload-file's first-frame flush — the
     buffer can end up at 0×0 or 1×1 and stay that way. We watch for stale
     dimensions and snap them back. The trigger is a real bug, not a guess:
     the symptom is "all data loads, game starts, resolution is one pixel". */
  function pinCanvasSize() {
    if (canvasEl.width !== TARGET_W) canvasEl.width = TARGET_W;
    if (canvasEl.height !== TARGET_H) canvasEl.height = TARGET_H;
  }
  pinCanvasSize();
  new MutationObserver(pinCanvasSize)
    .observe(canvasEl, { attributes: true,
                         attributeFilter: ['width', 'height', 'style'] });

  var progressEl = document.getElementById('progress');
  function fmtBytes(b) {
    if (b > 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
    if (b > 1024) return (b / 1024).toFixed(0) + ' KB';
    return b + ' B';
  }
  function showProgress(label, cur, tot) {
    if (tot > 0) {
      progressEl.hidden = false;
      progressEl.max = tot;
      progressEl.value = cur;
      var pct = (cur * 100 / tot).toFixed(1);
      statusEl.textContent =
          label + ' — ' + fmtBytes(cur) + ' / ' + fmtBytes(tot)
          + ' (' + pct + '%)';
    } else {
      progressEl.hidden = false;
      progressEl.removeAttribute('value');
      statusEl.textContent = label;
    }
  }
  function setStatus(text) {
    var m = text && text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
    if (m) {
      showProgress(text.replace(/\s*\(.*$/, ''),
                   parseFloat(m[1]), parseFloat(m[2]));
    } else if (text === 'Running.' || text === 'Running' || !text) {
      progressEl.hidden = true;
      statusEl.textContent = text || '';
    } else {
      /* Emscripten's "Preparing... N assets left" status doesn't carry
         total bytes; show the message and a determinate-looking but
         no-value progress bar so the user sees we're still going. */
      progressEl.hidden = false;
      progressEl.removeAttribute('value');
      statusEl.textContent = text;
    }
  }

  /* Intercept the XHR for jnengine.data so the user sees real download
     progress. Recent emscripten does NOT reliably emit setStatus calls
     with (loaded/total) byte counts during the preload XHR -- it might
     fire one initial "Downloading data..." and then go silent until
     decode finishes, leaving the user staring at a frozen "Downloading…"
     for the whole minute the 109 MB .data file takes. Wrapping
     XMLHttpRequest.open / .send lets us hook the real progress event
     for any URL containing 'jnengine.data', regardless of emscripten
     version. The wrappers are no-ops for every other XHR. */
  (function () {
    var _open = XMLHttpRequest.prototype.open;
    var _send = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function (method, url) {
      this.__jnUrl = url;
      return _open.apply(this, arguments);
    };
    XMLHttpRequest.prototype.send = function () {
      if (this.__jnUrl && /jnengine\.data/.test(this.__jnUrl)) {
        var self = this;
        this.addEventListener('progress', function (e) {
          if (e.lengthComputable) {
            showProgress('Downloading game data', e.loaded, e.total);
          } else {
            showProgress('Downloading game data', e.loaded, 0);
          }
        });
        this.addEventListener('load', function () {
          showProgress('Decoding game data', 1, 1);
        });
      }
      return _send.apply(this, arguments);
    };
  })();

  /* Content-hash suffix for the wasm/data assets. deploy_wasm.sh rewrites the
     literal __JN_ASSET_VER__ to ".<hash>" so the served files are
     jnengine.<hash>.wasm / jnengine.<hash>.data. These are cached immutable by
     fixed... no longer fixed: the hash changes every deploy, so a new build
     gets fresh URLs and can never pair new JS glue with a stale cached wasm
     (the ASM_CONSTS-mismatch black screen). Empty string in the dev tree
     (running `make web` locally) keeps the plain jnengine.wasm/.data names. */
  var JN_ASSET_VER = "__JN_ASSET_VER__";
  if (JN_ASSET_VER.indexOf("JN_ASSET_VER") !== -1) JN_ASSET_VER = "";

  /* Cache the heavy build artifacts in CacheStorage. The level picker reloads
     this page with a new ?level=... argument, but the wasm/data URLs stay the
     same for a given deploy. Emscripten fetches those assets through
     window.fetch, so intercept them here: first load stores the response,
     later level reloads read the 170MB data package directly from disk cache. */
  (function installBuildCache() {
    if (!('caches' in window) || !window.fetch) return;

    var nativeFetch = window.fetch.bind(window);
    var cacheName = 'jn-engine-build-' + (JN_ASSET_VER || 'dev');

    function buildAssetRequest(input, init) {
      var method = (init && init.method) ||
                   (input && input.method) ||
                   'GET';
      if (String(method).toUpperCase() !== 'GET') return null;

      var url;
      try {
        url = new URL((input && input.url) || input, window.location.href);
      } catch (e) {
        return null;
      }
      if (url.origin !== window.location.origin) return null;
      if (!/\/jnengine(?:\.[0-9a-f]{8})?\.(?:data|wasm)$/.test(url.pathname))
        return null;

      try {
        return input instanceof Request ? input : new Request(url.href, init);
      } catch (e) {
        return null;
      }
    }

    window.fetch = function (input, init) {
      var req = buildAssetRequest(input, init);
      if (!req) return nativeFetch(input, init);

      return caches.open(cacheName).then(function (cache) {
        return cache.match(req).then(function (cached) {
          if (cached) {
            if (/\.data$/.test(req.url))
              showProgress('Using cached game data', 1, 1);
            return cached;
          }
          return nativeFetch(req).then(function (response) {
            if (response && response.ok) {
              cache.put(req, response.clone()).catch(function () {});
            }
            return response;
          });
        });
      });
    };
  })();

  var Module = {
    locateFile: function (path) {
      if (JN_ASSET_VER && (path === 'jnengine.wasm' || path === 'jnengine.data'))
        return path.replace(/\.(wasm|data)$/, JN_ASSET_VER + '.$1');
      return path;
    },
    arguments: ['--level', selectedLevel],
    canvas: (function () {
      canvasEl.addEventListener('webglcontextlost', function (e) {
        alert('WebGL context lost — reload the page.'); e.preventDefault();
      }, false);
      return canvasEl;
    })(),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: setStatus,
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      setStatus(left ? ('Preparing… (' + left + ' assets left)') : 'Running.');
    }
  };
  setInterval(function () {
    if (!Module || !Module.ccall) return;
    try {
      setNoclipButton(!!Module.ccall('input_noclip_enabled', 'number', [], []));
    } catch (e) {}
  }, 250);
  setStatus('Downloading…');
  window.onerror = function (msg) { setStatus('Error: ' + msg); };

  /* ---- Touch controls: on-screen joystick + jump button ----
     Feeds the engine's virtual analog input (input.c) via the exported C
     functions. The joystick reports a camera-relative (right, forward) vector
     in the unit disc; the engine scales speed by its magnitude. Pointer Events
     give us multi-touch (move + jump simultaneously) with one code path. */
  (function () {
    var isTouch = window.matchMedia &&
                  window.matchMedia('(pointer: coarse)').matches;
    if (!isTouch) return;            /* desktop: keep keyboard only */
    document.body.classList.add('touch');

    var joy = document.getElementById('joy');
    var nub = document.getElementById('joynub');
    var jumpBtn = document.getElementById('jump');
    var downBtn = document.getElementById('flyDown');

    var mvx = 0, mvy = 0;            /* current stick vector, [-1,1] */
    var flyY = 0;                    /* held noclip vertical axis */
    var joyId = null;                /* active pointer id on the joystick */
    var jumpId = null, downId = null;

    function setMove(x, y) {
      /* C signature: input_set_virtual_move(float x, float y). y is +forward
         (stick pushed up = move away from camera). */
      if (Module && Module.ccall)
        try { Module.ccall('input_set_virtual_move', null,
                            ['number', 'number'], [x, y]); } catch (e) {}
    }
    function tapJump() {
      if (Module && Module.ccall)
        try { Module.ccall('input_press_virtual_jump', null, [], []); } catch (e) {}
    }
    function setFly(y) {
      flyY = y;
      if (Module && Module.ccall)
        try { Module.ccall('input_set_virtual_fly', null, ['number'], [flyY]); } catch (e) {}
    }
    function noclipEnabled() {
      return document.body.classList.contains('noclip');
    }

    function updateNub() {
      /* Visual: move nub to (mvx, -mvy) within the ring (screen y is down). */
      nub.style.left = (50 + mvx * 50) + '%';
      nub.style.top  = (50 - mvy * 50) + '%';
    }
    function fromEvent(ev) {
      var r = joy.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = (ev.clientX - cx) / (r.width / 2);
      var dy = (ev.clientY - cy) / (r.height / 2);
      /* screen y-down -> forward is up -> negate */
      var x = dx, y = -dy;
      var m = Math.hypot(x, y);
      if (m > 1) { x /= m; y /= m; }
      mvx = x; mvy = y; updateNub();
    }

    joy.addEventListener('pointerdown', function (ev) {
      joyId = ev.pointerId; joy.setPointerCapture(joyId);
      fromEvent(ev); ev.preventDefault();
    });
    joy.addEventListener('pointermove', function (ev) {
      if (ev.pointerId === joyId) { fromEvent(ev); ev.preventDefault(); }
    });
    function joyEnd(ev) {
      if (ev.pointerId === joyId) {
        joyId = null; mvx = 0; mvy = 0; updateNub();
      }
    }
    joy.addEventListener('pointerup', joyEnd);
    joy.addEventListener('pointercancel', joyEnd);

    jumpBtn.addEventListener('pointerdown', function (ev) {
      jumpId = ev.pointerId; jumpBtn.setPointerCapture(jumpId);
      if (noclipEnabled()) setFly(1);
      else tapJump();
      ev.preventDefault();
    });
    function jumpEnd(ev) {
      if (ev.pointerId === jumpId) {
        jumpId = null;
        if (flyY > 0) setFly(0);
      }
    }
    jumpBtn.addEventListener('pointerup', jumpEnd);
    jumpBtn.addEventListener('pointercancel', jumpEnd);

    downBtn.addEventListener('pointerdown', function (ev) {
      downId = ev.pointerId; downBtn.setPointerCapture(downId);
      setFly(-1); ev.preventDefault();
    });
    function downEnd(ev) {
      if (ev.pointerId === downId) {
        downId = null;
        if (flyY < 0) setFly(0);
      }
    }
    downBtn.addEventListener('pointerup', downEnd);
    downBtn.addEventListener('pointercancel', downEnd);

    /* Push the stick vector to the engine every animation frame while held.
       Continuous push (not just on move) keeps movement going when the finger
       is stationary at a deflected position. */
    function pump() {
      setMove(mvx, mvy);
      if (flyY !== 0) setFly(flyY);
      requestAnimationFrame(pump);
    }
    requestAnimationFrame(pump);
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
